name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux_amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm
            suffix: linux_arm
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin_arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
            suffix: windows_amd64.exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p bin
          go build \
            -o "bin/meshtastic_go_${{ matrix.suffix }}" \
            -ldflags="-X main.version=${VERSION}" \
            -tags netgo \
            -installsuffix netgo \
            ./cmd/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshtastic_go_${{ matrix.suffix }}
          path: bin/meshtastic_go_${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
